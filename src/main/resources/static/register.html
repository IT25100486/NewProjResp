<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Join Parkify</title>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen py-10 text-slate-200">
<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-[450px] border border-slate-700">
    <h2 class="text-2xl font-bold text-center mb-8">Create Account</h2>
    <form action="register" method="post" class="space-y-4">
        <input type="text" name="name" placeholder="Full Name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
        <input type="text" name="vehicleNo" placeholder="Vehicle Number (Ex: WP-BDB-1234)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
        <input type="tel" name="telNo" placeholder="Contact Number" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
        <select name="role" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
            <option value="student">Student</option>
            <option value="staff">Staff</option>
        </select>
        <input type="text" name="userId" placeholder="New User ID" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
        <input type="password" name="password" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Register Now</button>
    </form>
</div>
</body>
</html>
